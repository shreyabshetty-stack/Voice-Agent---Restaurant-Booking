<style>
        .glass-panel {
            background: rgba(18, 18, 20, 0.75);
            backdrop-filter: blur(16px);

        }

            animation: breathe 3s infinite ease-in-out;

            0%, 100% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex items-end justify-end p-4 md:p-8">
<!-- Background placeholder to simulate the restaurant website behind the widget -->
<div class="fixed inset-0 z-0">
<div class="bg-cover bg-center w-full h-full opacity-30" data-alt="A luxurious, modern Indian vegetarian restaurant interior, deeply toned dark slate and warm saffron lighting, blurred out to provide a sophisticated background for a floating widget." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAQR-l4GqiD5_BlWSd1OyfX3Wb_QjU7GvzYJRoY-6xCgKE-GGbf5EXVfFlcDrB4CHxMtX_6xhQs7VfiW-Usw7kkVGA5DCtgB3WzTCDfEZ9DUtfPjJETG2n-SMG1Xb00mKxhMdQ17wK2LS6O4AM5S2khVY42z31Jhhl_OOXlOlXnaDw9hk9GAc8kfIPmiHXdvdo0ly5ajDZhCGRsUrzqM5kVtySAqEg0_XAMbgmJF0BN7V_tXiEFDUox5g')"></div>

<!-- Floating Widget Container -->
<div class="glass-panel w-full md:w-widget-width-desktop h-full md:h-widget-max-height rounded-widget flex flex-col relative z-10 overflow-hidden transform transition-all duration-300">
<!-- Header -->
<div class="flex items-center justify-between p-6 border-b border-elevation-border bg-obsidian-slate/50">
<div>
<h2 class="font-widget-title text-widget-title text-on-surface">Voice Reservation Call</h2>
<div class="flex items-center gap-2 mt-1">
<span class="w-2 h-2 rounded-full bg-mint-emerald breathing-glow"></span>
<p class="font-muted-caption text-muted-caption text-mint-emerald">Connected — Low Latency Stream</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Center Content: Visualizer -->
<div class="flex-1 relative flex items-center justify-center overflow-hidden">
<!-- WebGL Shader Background -->

<!-- Overlay Text -->
<div class="relative z-10 bg-midnight-charcoal/40 backdrop-blur-md px-6 py-3 rounded-full border border-elevation-border">
<p class="font-body-text text-body-text text-on-surface font-semibold animate-pulse">Listening to you...</p>
</div>
<!-- Ambient Glow -->
<div class="absolute inset-0 pointer-events-none bg-gradient-to-t from-obsidian-slate via-transparent to-transparent z-0"></div>
</div>
<!-- Footer / Controls -->
<div class="p-6 pb-8 flex items-center justify-center gap-4 bg-obsidian-slate/80 border-t border-elevation-border backdrop-blur-xl">
<!-- Mute Toggle -->
<button class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border border-elevation-border text-on-surface hover:bg-surface-variant transition-colors group relative">
<span class="material-symbols-outlined" data-icon="mic_off">mic_off</span>
<div class="absolute -top-10 opacity-0 group-hover:opacity-100 transition-opacity bg-midnight-charcoal text-muted-caption font-muted-caption px-2 py-1 rounded border border-elevation-border pointer-events-none">Mute</div>
</button>
<!-- End Call (Capsule) -->
<button class="flex items-center gap-3 bg-chilli-red hover:bg-red-600 text-white px-8 py-4 rounded-full font-widget-title text-[18px] font-semibold transition-all hover:scale-105 active:scale-95 shadow-[0_0_15px_rgba(239,68,68,0.4)]">
<span class="material-symbols-outlined" data-icon="call_end" data-weight="fill" style="font-variation-settings: 'FILL' 1;">call_end</span>
                End Call
            </button>
<!-- Keyboard Mode -->
<button class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border border-elevation-border text-on-surface hover:bg-surface-variant transition-colors group relative">
<span class="material-symbols-outlined" data-icon="keyboard">keyboard</span>
<div class="absolute -top-10 opacity-0 group-hover:opacity-100 transition-opacity bg-midnight-charcoal text-muted-caption font-muted-caption px-2 py-1 rounded border border-elevation-border pointer-events-none">Type</div>
</button>
